[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adoc-viewer"
dynamic = ["version"]
description = "View AsciiDoc documents in the terminal"
readme = { file = "README.adoc", content-type = "text/plain" }
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Daniel Rezny", email = "daniel@rezny.eu" }]
dependencies = []

[project.optional-dependencies]
highlight = ["pygments>=2.10"]

[project.scripts]
adoc = "adocview.cli:main"

[tool.hatch.version]
path = "adocview/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["adocview"]

[dependency-groups]
dev = ["pytest>=8", "pygments>=2.10"]
