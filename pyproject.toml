[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adoc-viewer"
dynamic = ["version"]
description = "View AsciiDoc documents in the terminal"
readme = { file = "README.adoc", content-type = "text/plain" }
license-files = ["LICENSE"]
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Daniel Rezny", email = "daniel@rezny.eu" }]
keywords = ["asciidoc", "adoc", "terminal", "viewer", "pager", "tui", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
highlight = ["pygments>=2.10"]

[project.urls]
Homepage = "https://github.com/danielrezny/adoc-viewer"
Issues = "https://github.com/danielrezny/adoc-viewer/issues"
Changelog = "https://github.com/danielrezny/adoc-viewer/blob/main/CHANGELOG.adoc"

[project.scripts]
adoc = "adocview.cli:main"

[tool.hatch.version]
path = "adocview/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["adocview"]

[dependency-groups]
dev = ["pytest>=8", "pygments>=2.10"]
